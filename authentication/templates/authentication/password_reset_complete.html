{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Changed - PharmaHub</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

  <!-- ✅ Dark theme FLASH prevention -->
  <script>
    (function () {
      const saved = localStorage.getItem('pharmahub-theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = saved ? saved === 'dark' : prefersDark;
      document.documentElement.classList.toggle('dark', isDark);
    })();
  </script>

  <style>
    :root {
      --bg:     #f4f7fb;
      --card:   #ffffff;
      --text:   #1f2937;
      --muted:  #6b7280;
      --teal:   #008080;
      --teal2:  #0f766e;
      --orange: #FF7F50;
      --border: #e5e7eb;
      --green:  #16a34a;
    }
    html.dark {
      --bg:     #0f172a;
      --card:   #1f2937;
      --text:   #f3f4f6;
      --muted:  #9ca3af;
      --teal:   #14b8a6;
      --teal2:  #0f766e;
      --orange: #fb923c;
      --border: #374151;
      --green:  #4ade80;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: background 0.3s, color 0.3s;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 36px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    html.dark .card {
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    .icon-wrap {
      width: 64px; height: 64px;
      background: color-mix(in srgb, var(--green) 15%, transparent);
      border: 2px solid color-mix(in srgb, var(--green) 40%, var(--border));
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      font-size: 28px;
      color: var(--green);
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      color: var(--teal);
      margin-bottom: 12px;
    }
    p {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background: var(--teal);
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 12px 32px;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.88; }

   
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap"><i class="ri-checkbox-circle-line"></i></div>
    <h1>Password Changed!</h1>
    <p>Your password has been set successfully.<br>
       You may now log in with your new credentials.</p>
    <a href="{% url 'authentication:login_signup' %}" class="btn">Go to Login</a>
  </div>


</body>
</html>

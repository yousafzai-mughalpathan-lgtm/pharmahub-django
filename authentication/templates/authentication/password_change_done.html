{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Updated - PharmaHub</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --teal: #0d9488;
      --teal-dark: #0f766e;
      --border: #e5e7eb;
    }
    html.dark {
      --bg: #0f172a;
      --card: #1f2937;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --teal: #14b8a6;
      --teal-dark: #0f766e;
      --border: #374151;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { margin: 0 0 18px; color: var(--muted); }
    .btn {
      border: 0;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      display: inline-block;
      background: var(--teal);
      color: #fff;
    }
    .btn:hover { background: var(--teal-dark); }
  </style>
  <script>
    (function () {
      const savedTheme = localStorage.getItem('pharmahub-theme');
      document.documentElement.classList.toggle('dark', savedTheme === 'dark');
    })();
  </script>
</head>
<body>
  <div class="card">
    <h1>Password Updated</h1>
    <p>Your password has been changed successfully.</p>
    <a class="btn" href="{% url 'authentication:post_auth_redirect' %}">Go to Dashboard</a>
  </div>

</body>
</html>

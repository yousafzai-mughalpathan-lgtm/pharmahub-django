{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - PharmaHub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

  <!-- ✅ Dark theme FLASH prevention -->
  <script>
    (function () {
      const saved = localStorage.getItem('pharmahub-theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = saved ? saved === 'dark' : prefersDark;
      document.documentElement.classList.toggle('dark', isDark);
    })();
  </script>

  <style>
    :root {
      --teal:      #008080;
      --off-white: #F9F7F5;
      --orange:    #FF7F50;
      --text:      #1f2937;
      --muted:     #6b7280;
      --card:      #ffffff;
      --border:    #d1d5db;
    }
    html.dark {
      --teal:      #14b8a6;
      --off-white: #0f172a;
      --orange:    #fb923c;
      --text:      #f3f4f6;
      --muted:     #9ca3af;
      --card:      #1f2937;
      --border:    #374151;
    }

    * { box-sizing: border-box; }
    body {
      background: var(--off-white);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      font-family: sans-serif;
      height: 100vh;
      margin: 0;
      transition: background 0.3s, color 0.3s;
    }

    /* ── same 768px split container as login_signup ── */
    .container {
      background-color: var(--card);
      border-radius: 10px;
      box-shadow: 0 14px 28px rgba(0,0,0,0.25), 0 10px 10px rgba(0,0,0,0.22);
      position: relative;
      overflow: hidden;
      width: 768px;
      max-width: 90%;
      min-height: 480px;
      display: flex;
    }
    html.dark .container {
      box-shadow: 0 14px 28px rgba(0,0,0,0.5), 0 10px 10px rgba(0,0,0,0.4);
    }

    /* Left — form side */
    .form-side {
      width: 50%;
      background: var(--card);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 40px;
      text-align: center;
      transition: background 0.3s;
    }

    /* Right — image overlay (same as login_signup) */
    .overlay-side {
      width: 50%;
      background: var(--teal);
      background-image:
        linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
        url("{% static 'authentication/images/pic1.jpg' %}");
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      padding: 40px;
      text-align: center;
    }

    h1 {
      font-weight: bold;
      margin: 0 0 10px;
      color: var(--teal);
      font-size: 24px;
    }
    .overlay-side h1 { color: #ffffff; }

    p {
      font-size: 14px;
      color: var(--muted);
      line-height: 20px;
      margin: 0 0 20px;
    }
    .overlay-side p { color: rgba(255,255,255,0.85); }

    form {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    input[type="email"] {
      background-color: #eee;
      border: 1px solid var(--border);
      padding: 12px 15px;
      margin: 8px 0;
      width: 100%;
      border-radius: 5px;
      font-family: sans-serif;
      color: var(--text);
      font-size: 14px;
      transition: background 0.3s, border-color 0.3s;
    }
    html.dark input[type="email"] {
      background-color: #111827;
      color: var(--text);
      border-color: var(--border);
    }
    html.dark input[type="email"]::placeholder { color: var(--muted); }

    input[type="email"]:focus {
      outline: none;
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(20,184,166,0.15);
    }

    button[type="submit"] {
      border-radius: 20px;
      border: 1px solid var(--teal);
      background-color: var(--teal);
      color: #ffffff;
      font-size: 12px;
      font-weight: bold;
      padding: 12px 45px;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: transform 80ms ease-in, opacity 0.2s;
      cursor: pointer;
      margin-top: 15px;
      width: 100%;
    }
    button[type="submit"]:active { transform: scale(0.95); }
    button[type="submit"]:hover  { opacity: 0.9; }

    .back-link {
      margin-top: 15px;
      display: block;
      text-decoration: none;
      color: var(--orange);
      font-size: 12px;
      font-weight: 600;
    }
    .back-link:hover { text-decoration: underline; }

    .error-text {
      color: #ff4d4d;
      font-size: 11px;
      margin: 4px 0 0;
      text-align: left;
      width: 100%;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .overlay-side { display: none; }
      .form-side { width: 100%; }
      .container { width: 400px; min-height: 400px; }
    }

  </style>
</head>
<body>
  <div class="container">
    <!-- Left: Form -->
    <div class="form-side">
      <h1>Reset Password</h1>
      <p>Enter your email and we'll send you a reset link.</p>

      <form method="POST">
        {% csrf_token %}

        {% if form.errors %}
          <p class="error-text">{{ form.email.errors }}</p>
        {% endif %}

        <input
          type="email"
          placeholder="Email Address"
          name="{{ form.email.name }}"
          id="{{ form.email.id_for_label }}"
          required
        />
        <button type="submit">Send Reset Link</button>
        <a href="{% url 'authentication:login_signup' %}" class="back-link">← Back to Sign In</a>
      </form>
    </div>

    <!-- Right: Image overlay -->
    <div class="overlay-side">
      <h1>Forgot Your Password?</h1>
      <p>No worries! Enter your email and we'll help you get back in safely.</p>
      <i class="fas fa-envelope-open-text" style="font-size:50px; margin-top:20px; color: var(--orange);"></i>
    </div>
  </div>

 
</body>
</html>
